# GitLab CI：测试（含在空库上跑两遍迁移）→ 构建镜像 → main 自动部署测试环境 → v* 标签手动部署生产
# 部署 agent-app 时 deploy.sh 会先执行数据库迁移，迁移失败则保持旧版本
stages: [test, build, deploy]

variables:
  SERVICE: agent-app

test:
  stage: test
  image: node:22
  interruptible: true
  services:
    - name: mysql:8.0
      alias: mysql
    - name: redis:7
      alias: redis
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: agent_platform
    MYSQL_URL: mysql://root:root@mysql:3306/agent_platform
  cache:
    key: { files: [package-lock.json] }
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
    - npm test
    - npm run build
    - node scripts/wait-for-mysql.js
    - npm run migrate
    - npm run migrate
    - IT_MYSQL_URL="$MYSQL_URL" IT_REDIS_URL=redis://redis:6379 npx jest test/integration
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build-image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables: { DOCKER_TLS_CERTDIR: "/certs" }
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+/

# 部署：SSH 到环境里的每台机器，在部署目录执行 scripts/deploy.sh（失败自动回滚，见 crm-ai-agent/deploy）
# 需要的 CI/CD 变量（按环境 test / production 设置作用域）：
#   DEPLOY_HOSTS（空格分隔）、DEPLOY_USER、DEPLOY_DIR、SSH_PRIVATE_KEY（File 类型）、SSH_KNOWN_HOSTS（File 类型）
#   REGISTRY_DEPLOY_USER / REGISTRY_DEPLOY_TOKEN（Deploy Token，read_registry 权限）
.deploy:
  stage: deploy
  image: alpine:3.20
  interruptible: false
  before_script:
    - apk add --no-cache openssh-client >/dev/null
    - eval "$(ssh-agent -s)" >/dev/null
    - chmod 600 "$SSH_PRIVATE_KEY" && ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh && cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
  script:
    - |
      set -e
      for host in $DEPLOY_HOSTS; do
        echo "==> $host"
        printf '%s' "$REGISTRY_DEPLOY_TOKEN" | ssh "$DEPLOY_USER@$host" "docker login -u '$REGISTRY_DEPLOY_USER' --password-stdin '$CI_REGISTRY'"
        ssh "$DEPLOY_USER@$host" "cd '$DEPLOY_DIR' && ./scripts/deploy.sh $SERVICE $CI_COMMIT_SHORT_SHA"
      done

deploy-test:
  extends: .deploy
  environment: { name: test }
  resource_group: deploy-test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-prod:
  extends: .deploy
  environment: { name: production }
  resource_group: deploy-production
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
      when: manual
